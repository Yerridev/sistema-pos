<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema POS - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 font-[Inter] text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-6xl flex-col px-6 py-8">
        <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-5">
            <div>
                <p class="text-sm font-semibold uppercase tracking-wide text-emerald-600">Sistema POS</p>
                <h1 class="mt-1 text-3xl font-extrabold tracking-tight">Panel principal</h1>
            </div>
            <button id="logout" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700" type="button">
                Cerrar sesion
            </button>
        </header>

        <section class="grid flex-1 content-start gap-5 py-8 md:grid-cols-3">
            <article class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Usuario</p>
                <p id="user-id" class="mt-2 text-2xl font-bold">-</p>
            </article>
            <article class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Rol</p>
                <p id="user-role" class="mt-2 text-2xl font-bold capitalize">-</p>
            </article>
            <article class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Estado</p>
                <p class="mt-2 text-2xl font-bold text-emerald-600">Sesion activa</p>
            </article>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="text-xl font-bold">Accesos</h2>
            <div class="mt-4 flex flex-wrap gap-3">
                <a class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-100" href="/admin/">Administracion</a>
                <a class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-100" href="/api/docs/">Swagger API</a>
            </div>
        </section>
    </main>

    <script>
        const accessToken = localStorage.getItem('access_token');

        if (!accessToken) {
            window.location.href = '/login/';
        }

        document.getElementById('user-id').textContent = localStorage.getItem('user_id') || '-';
        document.getElementById('user-role').textContent = localStorage.getItem('user_rol') || '-';

        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user_rol');
            localStorage.removeItem('user_id');
            window.location.href = '/login/';
        });
    </script>
</body>
</html>
