<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sistema POS - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "error-container": "#ffdad6",
                "background": "#f3fcef",
                "primary-fixed": "#66ff8e",
                "surface-container-low": "#edf6e9",
                "warning": "#FFC107",
                "background-base": "#F7F8FA",
                "surface-bright": "#f3fcef",
                "surface-container": "#e7f1e4",
                "primary-hover": "#20BD5A",
                "secondary-fixed": "#a8f0e3",
                "surface-variant": "#dce5d8",
                "surface-container-high": "#e2ebde",
                "primary-container": "#25d366",
                "primary": "#006d2f",
                "secondary": "#1c695f",
                "on-secondary-container": "#226e63",
                "tertiary-container": "#ffa07e",
                "on-background": "#151e16",
                "outline-variant": "#bbcbb9",
                "on-tertiary": "#ffffff",
                "on-secondary": "#ffffff",
                "surface-container-lowest": "#ffffff",
                "secondary-container": "#a5ede0",
                "on-surface": "#151e16",
                "border-glass": "rgba(255, 255, 255, 0.3)",
                "border-subtle": "#E9EDEF",
                "on-tertiary-fixed-variant": "#763319",
                "on-primary-fixed-variant": "#005322",
                "error": "#EA0038",
                "secondary-fixed-dim": "#8cd4c7",
                "accent-glow": "#4ADE80",
                "on-surface-variant": "#3c4a3d",
                "on-tertiary-container": "#78351b",
                "on-error": "#ffffff",
                "tertiary": "#93492e",
                "critical-red-light": "#FEE2E2",
                "primary-fixed-dim": "#3de273",
                "surface-dim": "#d3ddd0",
                "on-tertiary-fixed": "#380d00",
                "surface-glass": "rgba(255, 255, 255, 0.6)",
                "on-secondary-fixed-variant": "#005047",
                "outline": "#6c7b6b",
                "text-secondary": "#667781",
                "inverse-surface": "#2a332a",
                "surface-container-highest": "#dce5d8",
                "surface": "#f3fcef",
                "surface-solid": "#FFFFFF",
                "text-primary": "#111B21",
                "on-primary-container": "#005523",
                "inverse-primary": "#3de273",
                "surface-tint": "#006d2f",
                "tertiary-fixed-dim": "#ffb59b",
                "on-primary": "#ffffff",
                "success": "#25D366",
                "on-secondary-fixed": "#00201c",
                "tertiary-fixed": "#ffdbcf",
                "inverse-on-surface": "#eaf3e6",
                "on-error-container": "#93000a",
                "on-primary-fixed": "#002109"
              },
              borderRadius: {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
              },
              spacing: {
                "base": "4px",
                "lg": "16px",
                "xl": "24px",
                "md": "12px",
                "xs": "4px",
                "sm": "8px",
                "xxl": "32px"
              },
              fontFamily: {
                "caption-xs": ["Inter", "sans-serif"],
                "body-main": ["Inter", "sans-serif"],
                "metadata-sm": ["Inter", "sans-serif"],
                "label-md": ["Inter", "sans-serif"],
                "title-lg": ["Inter", "sans-serif"],
                "price-table": ["JetBrains Mono", "monospace"],
                "display-total": ["JetBrains Mono", "monospace"]
              },
              fontSize: {
                "caption-xs": ["12px", {"lineHeight": "1.2", "fontWeight": "400"}],
                "body-main": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                "metadata-sm": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}],
                "label-md": ["16px", {"lineHeight": "1.4", "fontWeight": "500"}],
                "title-lg": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                "price-table": ["16px", {"lineHeight": "1", "fontWeight": "500"}],
                "display-total": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
        }
        .bg-pattern {
            background-color: #F7F8FA;
            background-image: radial-gradient(#25D366 0.5px, transparent 0.5px), radial-gradient(#25D366 0.5px, #F7F8FA 0.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.05;
        }
    </style>
</head>
<body class="bg-background-base font-body-main text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
    <!-- Background Accents -->
    <div class="absolute inset-0 bg-pattern z-0"></div>
    <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary-container/10 rounded-full blur-[120px] z-0"></div>
    <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-secondary-container/20 rounded-full blur-[120px] z-0"></div>

    <main class="relative z-10 w-full max-w-[440px] px-lg">
        <!-- Logo/Branding -->
        <div class="flex flex-col items-center mb-xl">
            <div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center neon-glow mb-md">
                <span class="material-symbols-outlined text-white text-4xl" data-weight="fill">point_of_sale</span>
            </div>
            <h1 class="font-title-lg text-display-total text-on-background tracking-tighter">
                Sistema <span class="text-primary-container">POS</span>
            </h1>
            <p class="font-metadata-sm text-text-secondary mt-base">Gestión de ventas profesional</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-xxl p-xl shadow-sm overflow-hidden">
            {% if error %}
            <div class="mb-lg p-md bg-critical-red-light rounded-lg border border-error">
                <p class="font-metadata-sm text-error">{{ error }}</p>
            </div>
            {% endif %}

            <!-- Login Form (Traditional POST) -->
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="space-y-lg">
                    <div class="space-y-sm">
                        <label class="font-label-md text-on-surface-variant block ml-1" for="id_username">Usuario</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors">person</span>
                            <input 
                                class="w-full h-[52px] pl-[48px] pr-md bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container outline-none transition-all placeholder:text-outline/50" 
                                id="id_username" 
                                name="username"
                                placeholder="Ingrese su usuario" 
                                type="text"
                                required
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <div class="space-y-sm">
                        <label class="font-label-md text-on-surface-variant block ml-1" for="id_password">Contraseña</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors">lock</span>
                            <input 
                                class="w-full h-[52px] pl-[48px] pr-md bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container outline-none transition-all placeholder:text-outline/50" 
                                id="id_password" 
                                name="password"
                                placeholder="••••••••" 
                                type="password"
                                required
                                autocomplete="current-password"
                            />
                        </div>
                    </div>

                    <button 
                        class="w-full h-[56px] bg-primary-container text-white font-label-md rounded-xl neon-glow hover:bg-primary-hover active:scale-[0.98] transition-all flex items-center justify-center space-x-sm" 
                        type="submit"
                    >
                        <span class="font-title-lg tracking-tight">Entrar</span>
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer Info -->
        <div class="mt-xl flex flex-col items-center space-y-md">
            <div class="flex items-center space-x-lg">
                <button class="flex items-center space-x-sm text-text-secondary hover:text-primary-container transition-colors" type="button">
                    <span class="material-symbols-outlined text-lg">language</span>
                    <span class="font-caption-xs uppercase tracking-widest">Español (ES)</span>
                </button>
                <div class="h-4 w-px bg-outline-variant"></div>
                <button class="flex items-center space-x-sm text-text-secondary hover:text-primary-container transition-colors" type="button">
                    <span class="material-symbols-outlined text-lg">help</span>
                    <span class="font-caption-xs uppercase tracking-widest">Soporte</span>
                </button>
            </div>
            <div class="font-price-table text-caption-xs text-outline/60 flex items-center space-x-sm bg-surface-container-low px-md py-xs rounded-full">
                <span class="w-2 h-2 bg-success rounded-full animate-pulse"></span>
                <span class="font-price-table">VERSION v1.0.0 • SYSTEM ACTIVE</span>
            </div>
        </div>
    </main>
</body>
</html>
