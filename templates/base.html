<!DOCTYPE html>
{% load static %}
<html lang="es-pe">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{% block title %}Cobrate POS{% endblock %}</title>
    <!-- Theme init: se ejecuta antes del render para evitar flash de tema incorrecto -->
    <script>
        (function () {
            var saved = localStorage.getItem('cobrate-theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = saved ? saved === 'dark' : prefersDark;
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
<!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006d2f",
                        "success": "#25D366",
                        "error": "#EA0038",
                        "warning": "#FFC107",
                        "text-primary": "#111B21",
                        "text-secondary": "#667781",
                        "background-base": "#F7F8FA",
                        "background": "#f3fcef",
                        "border-subtle": "#E9EDEF",
                        "border-glass": "rgba(255, 255, 255, 0.3)",
                        "surface-glass": "rgba(255, 255, 255, 0.6)",
                        "surface": "#f3fcef",
                        "surface-solid": "#FFFFFF",
                        "surface-bright": "#f3fcef",
                        "surface-dim": "#d3ddd0",
                        "surface-variant": "#dce5d8",
                        "surface-container": "#e7f1e4",
                        "surface-container-low": "#edf6e9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e2ebde",
                        "surface-container-highest": "#dce5d8",
                        "surface-tint": "#006d2f",
                        "on-surface": "#151e16",
                        "on-surface-variant": "#3c4a3d",
                        "on-background": "#151e16",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#005523",
                        "on-secondary-container": "#226e63",
                        "on-tertiary-container": "#78351b",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#002109",
                        "on-primary-fixed-variant": "#005322",
                        "on-secondary-fixed": "#00201c",
                        "on-secondary-fixed-variant": "#005047",
                        "on-tertiary-fixed": "#380d00",
                        "on-tertiary-fixed-variant": "#763319",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#66ff8e",
                        "primary-fixed-dim": "#3de273",
                        "secondary-fixed": "#a8f0e3",
                        "secondary-fixed-dim": "#8cd4c7",
                        "tertiary-fixed": "#ffdbcf",
                        "tertiary-fixed-dim": "#ffb59b",
                        "critical-red-light": "#FEE2E2",
                        "outline": "#6c7b6b",
                        "outline-variant": "#bbcbb9",
                        "inverse-surface": "#2a332a",
                        "inverse-primary": "#3de273",
                        "inverse-on-surface": "#eaf3e6",
                        "secondary": "#1c695f",
                        "tertiary": "#93492e",
                        "primary-container": "#25d366",
                        "secondary-container": "#a5ede0",
                        "tertiary-container": "#ffa07e",
                        "primary-hover": "#20BD5A",
                        "accent-glow": "#4ADE80",
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px",
                    },
                    spacing: {
                        base: "4px",
                        xs: "4px",
                        sm: "8px",
                        md: "12px",
                        lg: "16px",
                        xl: "24px",
                        xxl: "32px",
                    },
                    fontFamily: {
                        "caption-xs": ["Inter", "sans-serif"],
                        "price-table": ["JetBrains Mono", "monospace"],
                        "metadata-sm": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "title-lg": ["Inter", "sans-serif"],
                        "body-main": ["Inter", "sans-serif"],
                        "display-total": ["JetBrains Mono", "monospace"],
                    },
                    fontSize: {
                        "caption-xs": ["12px", { lineHeight: "1.2", fontWeight: "400" }],
                        "price-table": ["16px", { lineHeight: "1", fontWeight: "500" }],
                        "metadata-sm": ["14px", { lineHeight: "1.4", fontWeight: "400" }],
                        "label-md": ["16px", { lineHeight: "1.4", fontWeight: "500" }],
                        "title-lg": ["20px", { lineHeight: "1.4", fontWeight: "600" }],
                        "body-main": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                        "display-total": ["32px", { lineHeight: "1.2", fontWeight: "600" }],
                    },
                }
            }
        };
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neon-glow {
            box-shadow: 0 0 8px rgba(37, 211, 102, 0.4);
        }
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-background-base dark:bg-[#15171C] font-body-main text-on-surface dark:text-[#E8E9EC] min-h-screen flex transition-colors">
    <script>
        function toggleTheme() {
            var isDark = document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light', !isDark);
            localStorage.setItem('cobrate-theme', isDark ? 'dark' : 'light');
            syncThemeIcon();
        }
        function syncThemeIcon() {
            var isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('[data-theme-icon]').forEach(function (el) {
                el.textContent = isDark ? 'light_mode' : 'dark_mode';
            });
        }
        document.addEventListener('DOMContentLoaded', syncThemeIcon);
    </script>
    <!-- Sidebar -->
    {% include "components/sidebar.html" %}
    
    <!-- Main Content -->
    <main class="flex-grow md:ml-64 flex flex-col">
        <!-- Top Bar -->
        {% include "components/navbar.html" %}
        
        <!-- Content Area -->
        <div class="p-xl flex flex-col gap-xl flex-grow">
            {% block content %}{% endblock %}
        </div>
        
        <!-- Footer -->
        {% include "components/footer.html" %}
    </main>
    
    <!-- FAB for Mobile -->
    <button class="md:hidden fixed bottom-6 right-6 w-14 h-14 rounded-full bg-primary text-white shadow-xl flex items-center justify-center neon-glow active:scale-95 transition-all z-50">
        <span class="material-symbols-outlined" data-icon="add">add</span>
    </button>
    
    <script>
        (function () {
            function _getCsrfToken() {
                var match = document.cookie.match(/csrftoken=([^;]+)/);
                return match ? decodeURIComponent(match[1]) : '';
            }
            function apiFetch(url, options) {
                options = options || {};
                var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
                var csrfToken = _getCsrfToken();
                if (csrfToken) headers['X-CSRFToken'] = csrfToken;
                var fetchOpts = Object.assign({}, options, { headers: headers });
                if (options.body) fetchOpts.body = typeof options.body === 'string' ? options.body : JSON.stringify(options.body);
                return fetch(url, fetchOpts).then(function (res) {
                    return res.json().then(function (data) {
                        return { ok: res.ok, status: res.status, data: data };
                    });
                });
            }
            function showToast(message, type) {
                type = type || 'success';
                var container = document.createElement('div');
                container.className = 'fixed top-5 right-5 z-[200] flex items-center gap-sm px-lg py-md rounded-xl shadow-lg text-white text-sm font-medium transition-all';
                container.style.backgroundColor = type === 'success' ? '#25D366' : '#EA0038';
                var icon = document.createElement('span');
                icon.className = 'material-symbols-outlined text-[18px]';
                icon.textContent = type === 'success' ? 'check_circle' : 'error';
                var msg = document.createElement('span');
                msg.textContent = message;
                container.appendChild(icon);
                container.appendChild(msg);
                document.body.appendChild(container);
                setTimeout(function () { container.remove(); }, 3000);
            }
            function setLoading(element, isLoading) {
                if (!element) return;
                element.disabled = isLoading;
                var txtEl = element.querySelector('[data-loading-text]');
                if (txtEl) txtEl.textContent = isLoading ? 'Guardando...' : 'Guardar';
                var icoEl = element.querySelector('[data-loading-icon]');
                var spinnerEl = element.querySelector('[data-spinner]');
                if (icoEl) icoEl.classList.toggle('hidden', isLoading);
                if (spinnerEl) spinnerEl.classList.toggle('hidden', !isLoading);
            }
            function openModal(id) {
                var modal = document.getElementById(id);
                if (!modal) return;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                var focusable = modal.querySelector('input, textarea, select, button');
                if (focusable) focusable.focus();
            }
            function closeModal(id) {
                var modal = document.getElementById(id);
                if (!modal) return;
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
            window.UIKit = { apiFetch: apiFetch, showToast: showToast, setLoading: setLoading, openModal: openModal, closeModal: closeModal };
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
