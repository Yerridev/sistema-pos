<!DOCTYPE html>
{% load static %}
<html lang="es-pe">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{% block title %}Cobrate POS{% endblock %}</title>
    <!-- Theme init: se ejecuta antes del render para evitar flash de tema incorrecto -->
    <script>
        (function () {
            var saved = localStorage.getItem('cobrate-theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = saved ? saved === 'dark' : prefersDark;
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
<!-- Tailwind CSS -->
    <script src="{% static 'js/tailwind.config.js' %}"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neon-glow {
            box-shadow: 0 0 8px rgba(37, 211, 102, 0.4);
        }
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-background-base dark:bg-[#15171C] font-body-main text-on-surface dark:text-[#E8E9EC] min-h-screen flex transition-colors">
    <script>
        function toggleTheme() {
            var isDark = document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light', !isDark);
            localStorage.setItem('cobrate-theme', isDark ? 'dark' : 'light');
            syncThemeIcon();
        }
        function syncThemeIcon() {
            var isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('[data-theme-icon]').forEach(function (el) {
                el.textContent = isDark ? 'light_mode' : 'dark_mode';
            });
        }
        document.addEventListener('DOMContentLoaded', syncThemeIcon);
    </script>
    <!-- Sidebar -->
    {% include "components/sidebar.html" %}
    
    <!-- Main Content -->
    <main class="flex-grow md:ml-64 flex flex-col">
        <!-- Top Bar -->
        {% include "components/navbar.html" %}
        
        <!-- Content Area -->
        <div class="p-xl flex flex-col gap-xl flex-grow">
            {% block content %}{% endblock %}
        </div>
        
        <!-- Footer -->
        {% include "components/footer.html" %}
    </main>
    
    <!-- FAB for Mobile -->
    <button class="md:hidden fixed bottom-6 right-6 w-14 h-14 rounded-full bg-primary text-white shadow-xl flex items-center justify-center neon-glow active:scale-95 transition-all z-50">
        <span class="material-symbols-outlined" data-icon="add">add</span>
    </button>
    
    <script src="{% static 'js/ui-kit.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
